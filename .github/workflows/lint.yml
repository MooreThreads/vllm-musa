name: Lint

# Runs the repository's declared lint suite: the hooks in
# `.pre-commit-config.yaml`, the same set `make pre-commit` runs.
#
# Scope:
#   * pull request: only the files the pull request changes (`--from-ref`
#     against the base branch), so drift elsewhere in the tree cannot block an
#     unrelated change and a docs-only pull request finishes in seconds;
#     pull requests that modify `.pre-commit-config.yaml`, `pyproject.toml`,
#     or this workflow escalate to the whole tree (`--all-files`);
#   * push to a `v*.0-dev` branch: the whole tree (`--all-files`), so drift
#     cannot silently accumulate on a development branch;
#   * workflow_dispatch: the whole tree, for a manual re-check.
#
# There is deliberately no `paths:` filter. Pre-commit is a required check, so
# every pull request has to report it; a filtered trigger would leave unrelated
# pull requests waiting for a check that never starts.
#
# Hook versions are pinned in `.pre-commit-config.yaml`; the runner below is
# pinned to the version that suite is validated against.

on:
  pull_request:
  push:
    branches:
      - 'v*.0-dev'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref so a pull-request run and a branch run never cancel each other.
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # `--from-ref` diffs against the merge base with the base branch, so
          # this cannot be a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install 'pre-commit==3.7.1'
      - name: Select the lint scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            echo "Linting the whole tree."
            exit 0
          fi
          # A `pull_request` checkout guarantees the merge commit and, at
          # `fetch-depth: 0`, the base repository's branches. Fail loudly
          # instead of quietly linting the whole tree if that ever changes.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
            echo "::error::origin/${BASE_REF} is not in the checkout; cannot scope the lint run."
            exit 1
          fi
          # Policy or hook changes can turn untouched files red after merge, so
          # escalate those pull requests to the whole tree.
          changed_lint_config=$(
            git diff --name-only "origin/${BASE_REF}...HEAD" -- \
              .pre-commit-config.yaml \
              pyproject.toml \
              .github/workflows/lint.yml
          )
          if [ -n "${changed_lint_config}" ]; then
            echo "Lint config changed; linting the whole tree."
            exit 0
          fi
          echo "from_ref=origin/${BASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "to_ref=HEAD" >> "${GITHUB_OUTPUT}"
          echo "Linting the files this pull request changes against origin/${BASE_REF}."
      - name: Run pre-commit
        env:
          FROM_REF: ${{ steps.scope.outputs.from_ref }}
          TO_REF: ${{ steps.scope.outputs.to_ref }}
        run: |
          set -euo pipefail
          # `--show-diff-on-failure` turns "files were modified" into a reviewable
          # patch in the log; fixing hooks only ever run locally.
          if [ -n "${FROM_REF}" ]; then
            pre-commit run \
              --from-ref "${FROM_REF}" \
              --to-ref "${TO_REF}" \
              --show-diff-on-failure \
              --color=always
          else
            pre-commit run \
              --all-files \
              --show-diff-on-failure \
              --color=always
          fi
