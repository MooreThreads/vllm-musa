name: Patch series gates

on:
  pull_request:
    paths:
      - '.github/workflows/patch-series.yml'
      - 'third_party/PINS'
      - 'tools/musa_sync.py'
      - 'tools/patch_metadata.py'
      - 'vllm_musa/patches/**'
      - 'tests/**'
  push:
    branches:
      - 'upstream/v0.32.0-dev'
      - 'vllm-upgrade-v032'
    paths:
      - '.github/workflows/patch-series.yml'
      - 'third_party/PINS'
      - 'tools/musa_sync.py'
      - 'tools/patch_metadata.py'
      - 'vllm_musa/patches/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  offline-series:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Test metadata, manifest, and lineage
        run: |
          python -m pytest -q tests/test_patch_metadata.py tests/test_musa_sync.py tests/test_musa_sync_upstream.py tests/test_manifest.py tests/test_manifest_completeness.py tests/test_ordered_series_lineage.py
          python tools/musa_sync.py report --metadata
          python tools/musa_sync.py check-series
      - name: Check patch contracts in runtime test modules
        run: |
          python -m pytest -q tests/test_deepseek_v4_sparse_indexer_topk.py -k 'test_radix_topk_lives or test_series_routes'
          python -m pytest -q tests/test_dsv41_adaptive_verification.py -k 'test_series_'
          python -m pytest -q tests/test_dsv4_moe_shared_fold.py -k test_biased_dsv4_gates
      - name: Prepare pristine upstream checkout
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^VLLM_COMMIT=//p' third_party/PINS)
          test "$pin" != ''
          git clone https://github.com/vllm-project/vllm.git "$RUNNER_TEMP/vllm-pin"
          git -C "$RUNNER_TEMP/vllm-pin" checkout --detach "$pin"
          test "$(git -C "$RUNNER_TEMP/vllm-pin" rev-parse HEAD)" = "$pin"
          test -z "$(git -C "$RUNNER_TEMP/vllm-pin" status --porcelain)"
          echo "PIN_REPO=$RUNNER_TEMP/vllm-pin" >> "$GITHUB_ENV"
      - name: Replay and verify against pristine pin
        run: |
          python tools/musa_sync.py check-series --repo "$PIN_REPO" --replay
          python tools/musa_sync.py verify --repo "$PIN_REPO"
      - name: Build separate commit-bearing series holder
        shell: bash
        run: |
          set -euo pipefail
          git clone --local "$PIN_REPO" third_party/vllm
          test "$(git -C third_party/vllm rev-parse HEAD)" = "$(sed -n 's/^VLLM_COMMIT=//p' third_party/PINS)"
          export GIT_COMMITTER_NAME='musa-series-ci'
          export GIT_COMMITTER_EMAIL='musa-series-ci@example.invalid'
          shopt -s nullglob
          patches=(vllm_musa/patches/series/[0-9][0-9][0-9][0-9]-*.patch vllm_musa/patches/series/upstream/*.patch)
          for patch in "${patches[@]}"; do
            git -C third_party/vllm am -3 "$GITHUB_WORKSPACE/$patch"
          done
          echo "Applied ${#patches[@]} mailbox entries to separate holder"
          python tools/musa_sync.py check-series --repo third_party/vllm --round-trip
      - name: Check applied-tree source contracts
        run: python -m pytest -q tests/test_*source.py
