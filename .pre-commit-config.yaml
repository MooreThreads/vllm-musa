default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      # Series entries are `git format-patch` output: a context line for an
      # empty source line is a single space, so these hooks would rewrite the
      # diff. They are byte-pinned by `musa_sync check-series --round-trip`.
      - id: trailing-whitespace
        exclude: ^vllm_musa/patches/series/.*\.patch$
      - id: end-of-file-fixer
        exclude: ^vllm_musa/patches/series/.*\.patch$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args:
          - --select=F401,F821
          - --fix
        files: ^(vllm_musa/|tests/|example/)
        exclude: |
          (?x)^(
          .*/__init__\.py$
          )$
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--config', '.codespellrc']
