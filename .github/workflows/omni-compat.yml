name: Omni compat gates

on:
  pull_request:
    paths:
      - '.github/workflows/omni-compat.yml'
      - 'vllm_musa/omni_compat/**'
      - 'vllm_musa/v1/sample/**'
      - 'vllm_musa/v1/__init__.py'
      - 'vllm_musa_omni_compat_pth.py'
      - 'tools/check_omni_compat.py'
      - 'tests/test_omni_compat.py'
      - 'tests/test_omni_headless_wheels.py'
      - 'docker/omni/**'
      - 'docker/omni.Dockerfile'
      - 'docker/build_omni_image.sh'
  push:
    branches:
      - 'v*.0-dev'
    paths:
      - '.github/workflows/omni-compat.yml'
      - 'vllm_musa/omni_compat/**'
      - 'vllm_musa/v1/sample/**'
      - 'vllm_musa/v1/__init__.py'
      - 'vllm_musa_omni_compat_pth.py'
      - 'tools/check_omni_compat.py'
      - 'tests/test_omni_compat.py'
      - 'tests/test_omni_headless_wheels.py'
      - 'docker/omni/**'
      - 'docker/omni.Dockerfile'
      - 'docker/build_omni_image.sh'

permissions:
  contents: read

jobs:
  offline-shim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9' packaging wheel
      # The shim, its bootstrap and its audit tool are standard library only,
      # and the suite builds the two vLLM layouts it needs on disk, so no step
      # here needs torch, torch_musa, vLLM or a GPU.
      - name: Test the drift shim and headless wheels
        run: python -m pytest -q tests/test_omni_compat.py tests/test_omni_headless_wheels.py
