[build-system]
# Keep build tool pins mirrored in requirements/build.txt. Source distribution
# builds use these public dependencies. Wheel and editable builds use
# --no-build-isolation with the prepared MUSA stack.
requires = ["setuptools>=80.10.2,<81.0.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-musa"
version = "0.1.32"
description = "vLLM platform plugin for Moore Threads (MUSA) GPUs"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = "==3.12.*"
authors = [
    {name = "vLLM Community"},
]
keywords = ["vllm", "musa", "moore-threads", "llm", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ["requirements/dev.txt"]}
musa = {file = ["requirements/musa_private.txt"]}

[project.scripts]
vllm = "vllm.entrypoints.cli.main:main"
vllm_collect_env = "vllm_musa:collect_env"

[project.entry-points."vllm.platform_plugins"]
musa = "vllm_musa:musa_platform_plugin"

[project.entry-points."vllm.general_plugins"]
musa_out_of_tree = "vllm_musa:register_out_of_tree"
musa_attn_backends = "vllm_musa:register_attn_backends"
lora_filesystem_resolver = "vllm.plugins.lora_resolvers.filesystem_resolver:register_filesystem_resolver"
lora_hf_hub_resolver = "vllm.plugins.lora_resolvers.hf_hub_resolver:register_hf_hub_resolver"

[project.urls]
Homepage = "https://github.com/MooreThreads/vllm-musa"
Repository = "https://github.com/MooreThreads/vllm-musa"

[tool.setuptools]
# Top-level module, not a vllm_musa submodule: the Omni compat .pth must be
# loadable without executing vllm_musa/__init__.py, which imports torch.
py-modules = ["vllm_musa_omni_compat_pth"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_musa*"]

[tool.setuptools.package-data]
vllm_musa = [
    "jit_kernel/csrc/*.h",
    "jit_kernel/csrc/*/*.mu",
    "jit_kernel/include/.gitkeep",
    "jit_kernel/tilelang/*.h",
    "tuning/*.json",
]

# Mirrors upstream vLLM's `[tool.ruff]` block, which has no top-level section:
# `line-length` is ruff's 88 default and `target-version` is inferred from
# `requires-python` (3.12), so the pyupgrade rules may use 3.12-only syntax.
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405",
    "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # `StrEnum` changes `str()` and `format()` output of members
    "UP042",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.typos.files]
# Upstream mailbox patches and the recorded drift diffs: patch context splits
# words mid-identifier, so every hit there is noise. `third_party` holds the
# pinned vLLM checkout.
extend-exclude = [
    "vllm_musa/patches/series/*",
    "vllm_musa/patches/module-drift/*",
    "third_party/*",
    ".git/*",
]

[tool.typos.default]
# `use_ue8m0=` / `ue8m0`: the UE8M0 scale format, not the word "use".
extend-ignore-identifiers-re = [".*[Uu][Ee][0-9][Mm][0-9].*"]

[tool.typos.default.extend-identifiers]
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"
sharedMemPerBlockOptin = "sharedMemPerBlockOptin"

[tool.typos.default.extend-words]
# torch.arange and Triton/TileLang vocabulary shared with upstream vLLM.
arange = "arange"
ba = "ba"
dout = "dout"
eles = "eles"
indx = "indx"
tme = "tme"
TME = "TME"
# MUSA terms.
bse = "bse"  # stride_bse: batch x seq x expert strides
muh = "muh"  # MUSA kernel header extension
nativ = "nativ"  # a patch file name is truncated to "...-to-nativ.patch"
mis = "mis"  # "mis-resolves", "mis-handle"
ot = "ot"  # out-token stride
caf = "caf"  # first three bytes of the `caf\xe9` path fixtures
nothink = "nothink"  # GLM template name used in the recipe commands
